name: build-image

# 镜像的版本与内容完全跟随上游仓库的 main 分支：
#   - 上游 main 有新提交  -> 定时任务检出上游 -> 构建并推送新镜像
#   - 手动触发            -> 立即构建
#   - 本仓库 docker/ 改动 -> 立即构建
#
# 关键点：构建时**不**使用本仓库的任何分支作为源码，而是检出上游仓库
# （Ebony-Vinyl/dsh-our-free-model）的 main，再把本仓库 docker/ 目录里的
# Dockerfile 覆盖上去。理由有二：
#
#   1. 本仓库的 main 分支要留给"纯上游内容"，容器化文件放在 docker 分支；
#   2. 即使 docker 分支还没来得及同步，镜像也已经是上游的最新代码——
#      两个分支谁新谁旧都不影响镜像的内容。
#
# checkout 的 path 参数把两个仓库放在不同目录，互不覆盖，因此同步流程
# 与构建流程之间没有先后依赖，也不需要处理合并冲突。

on:
  schedule:
    # 每天一次，避开整点以躲开调度高峰。用 UTC。
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [build-image]
  push:
    branches:
      - docker
    paths:
      - "docker/**"
      - "scripts/collect-standalone-runtime.mjs"
      - ".github/workflows/build-image.yml"

# 说明：
#   - fork 里的定时任务默认是关闭的，需要在 Actions 页面手动 Enable。
#   - 用 GITHUB_TOKEN 推送不会再次触发工作流（只有 workflow_dispatch 和
#     repository_dispatch 一定会触发），所以本文件自己推送 docker 分支时
#     需要用下面的 repository_dispatch，而不是依赖 push 事件。
permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

env:
  UPSTREAM_REPO: Ebony-Vinyl/dsh-our-free-model
  REGISTRY: ghcr.io
  IMAGE_NAME: docker-our-free-model

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      # 1) 取出上游仓库的 main —— 镜像的源码就是它。
      - name: Check out upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main
          path: upstream
          fetch-depth: 1

      # 2) 取出本仓库的 docker/ —— 容器化文件在这里。
      - name: Check out this repository (container files)
        uses: actions/checkout@v4
        with:
          path: overlay
          sparse-checkout: |
            docker
            scripts/collect-standalone-runtime.mjs
          sparse-checkout-cone-mode: false

      # 3) 合成：上游源码 + 我们的容器化文件。
      - name: Compose upstream source with the container overlay
        run: |
          set -euo pipefail
          mkdir -p upstream/docker
          cp -a overlay/docker/. upstream/docker/
          mkdir -p upstream/scripts
          cp -a overlay/scripts/collect-standalone-runtime.mjs upstream/scripts/
          echo "--- container files in the build context ---"
          find upstream/docker -maxdepth 1 -type f | sort
          echo "--- upstream version ---"
          node -p "require('./upstream/package.json').version"

      # 4) 从上游源码里读出版本号与提交号，并自己算出镜像标签与 OCI 标签。
      #
      # 这里**不用** docker/metadata-action：它读的是"当前工作流仓库"的
      # git 上下文，而我们的源码来自另一个仓库（上游），它的
      # `context: git:<dir>` 只在未发布的 master 上存在，v5 / v6 都会报
      # "Invalid context source: git:upstream"。自己算反而更直接——上游的
      # 版本号和提交号本来就是在上一步从上游目录里读出来的。
      - name: Derive version, commit, tags and labels
        id: meta
        working-directory: upstream
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse HEAD)
          SHA7=${SHA:0:7}
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          # 标签：上游版本号是主标签，latest 跟着它走。
          # build-push-action 的 `tags` 输入按**逗号**分隔（Util.getInputList
          # 的默认行为），所以这里用逗号。
          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:upstream-${SHA7}"
          TAGS="${TAGS},${IMAGE}:sha-${SHA}"
          TAGS="${TAGS},${IMAGE}:latest"

          # OCI 标签。source 指向本仓库（镜像的来源），revision 指向上游
          # 提交（代码实际来自哪里）——两者不是同一个仓库，都写上。
          #
          # `labels` 输入用 ignoreComma:true 解析，也就是**只按换行**分隔，
          # 逗号会被当成标签内容的一部分。所以这里必须用换行，不能用逗号——
          # 用逗号会把 6 个标签拼成 1 个，构建出来的镜像只剩一个畸形标签。
          #
          # 描述里也不用逗号：即使分隔符是换行，CSV 解析器仍然按逗号切列，
          # 值里带逗号会让解析结果依赖引号规则。标签值保持简单可预期。
          #
          # 换行不能用 `NL=$(printf '\n')` 再插值——命令替换会吃掉结尾的换行，
          # 结果是 6 个标签被拼成 1 行。这里直接用 $'\n'（bash 语法，GitHub
          # Actions 的默认 shell 是 bash）。
          LABELS="org.opencontainers.image.source=https://github.com/urarattas/docker-our-free-model"
          LABELS="${LABELS}"$'\n'"org.opencontainers.image.licenses=MIT"
          LABELS="${LABELS}"$'\n'"org.opencontainers.image.title=Our Free Model (standalone)"
          LABELS="${LABELS}"$'\n'"org.opencontainers.image.description=Our Free Model standalone service built from upstream ${SHA7}"
          LABELS="${LABELS}"$'\n'"org.opencontainers.image.version=${VERSION}"
          LABELS="${LABELS}"$'\n'"org.opencontainers.image.revision=${SHA}"

          {
            echo "version=${VERSION}"
            echo "sha=${SHA}"
            echo "sha7=${SHA7}"
            echo "tags=${TAGS}"
            # 多行输出用 heredoc 形式，避免换行被当成多行 GITHUB_OUTPUT 语法。
            echo "labels<<OFM_LABELS_EOF"
            echo "${LABELS}"
            echo "OFM_LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VERSION} sha=${SHA}"
          echo "tags: ${TAGS}"
          echo "labels:"
          echo "${LABELS}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # context 必须是路径（upstream），不能是 Git 上下文：BuildKit 在 Git
      # 上下文下会自己重新 clone 仓库，第 3 步的合成结果会被完全忽略。
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### 镜像已发布"
            echo ""
            echo "- 上游提交：\`${{ steps.meta.outputs.sha }}\`"
            echo "- 上游版本：${{ steps.meta.outputs.version }}"
            echo "- 标签：\`${{ steps.meta.outputs.tags }}\`"
            echo "- 摘要：\`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# 注意：这里**不**再去 dispatch sync-upstream。
#
# 同步方向只有一条：sync-upstream 同步完分支后 dispatch build-image。
# 两条流程互相 dispatch 会形成无限回环——每次同步触发一次构建，每次构建
# 又触发一次同步。分支同步本身有独立的定时任务（03:43 UTC），镜像构建也
# 有自己的定时任务（03:17 UTC），两者都不依赖对方。
